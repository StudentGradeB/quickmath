<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>QuickMath — Speed Drill</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0E1419" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    --bg:#0E1419; --surface:#161E27; --surface2:#1E2832;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
    --text:#EAEFF4; --muted:#8593A0; --faint:#5A6675;
    --accent:#FFB22C; --accent2:#E89C12;
    --ok:#34D399; --bad:#FB6F6F;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --r:14px;
  }
  [data-theme="light"]{
    --bg:#EEF1F5; --surface:#FFFFFF; --surface2:#E7ECF1;
    --line:rgba(16,24,32,.10); --line2:rgba(16,24,32,.18);
    --text:#11181F; --muted:#566472; --faint:#8A97A4;
    --accent:#D9850A; --accent2:#B86E06;
    --ok:#0E9F6E; --bad:#E0484D;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
    padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  .app{width:100%;max-width:480px;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}
  .screen{display:none;flex:1;flex-direction:column;padding-top:18px;animation:fade .25s ease;}
  .screen.on{display:flex;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .brand{display:flex;align-items:baseline;gap:9px;}
  .brand b{font-size:19px;font-weight:650;letter-spacing:-.02em;}
  .brand span{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;}
  .icobtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);
    color:var(--muted);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .icobtn:active{transform:scale(.94);}

  .label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 11px 2px;}
  .block{margin-bottom:26px;}

  .ops{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .op{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);
    font-family:var(--mono);font-size:30px;color:var(--muted);cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:all .14s ease;font-weight:500;}
  .op:active{transform:scale(.95);}
  .op.sel{background:var(--accent);color:#1a1205;border-color:var(--accent);font-weight:700;}

  .seg{display:flex;gap:8px;}
  .seg .t{font-size:13px;color:var(--muted);align-self:center;width:46px;}
  .pill{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 0;
    text-align:center;font-family:var(--mono);font-size:16px;color:var(--muted);cursor:pointer;transition:all .12s;}
  .pill:active{transform:scale(.96);}
  .pill.sel{background:var(--surface2);color:var(--accent);border-color:var(--accent);font-weight:600;}
  .seg+.seg{margin-top:9px;}

  .field{display:flex;align-items:center;justify-content:space-between;gap:12px;
    border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 6px 6px 16px;}
  .field+.field{margin-top:10px;}
  .field label{font-size:15px;color:var(--text);}
  .field .sub{font-size:12px;color:var(--faint);display:block;}
  .field input{width:96px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;
    color:var(--text);font-family:var(--mono);font-size:20px;text-align:center;padding:10px 8px;outline:none;font-weight:600;}
  .field input:focus{border-color:var(--accent);}

  .start{margin-top:auto;border:none;background:var(--accent);color:#1a1205;font-family:var(--sans);
    font-size:17px;font-weight:700;border-radius:var(--r);padding:17px;cursor:pointer;letter-spacing:.01em;
    transition:transform .1s,opacity .15s;}
  .start:active{transform:scale(.98);}
  .start:disabled{opacity:.4;cursor:not-allowed;}
  .hint{text-align:center;color:var(--faint);font-size:12.5px;margin:11px 0 2px;min-height:16px;}

  .gtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .qcount{font-family:var(--mono);font-size:15px;color:var(--muted);}
  .qcount b{color:var(--text);font-size:17px;}
  .clock{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--text);}
  .quit{background:none;border:none;color:var(--faint);font-size:13px;cursor:pointer;padding:6px;}

  .bars{display:flex;flex-direction:column;gap:7px;margin:14px 0 4px;}
  .track{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;position:relative;}
  .fill{height:100%;width:0;border-radius:6px;transition:width .25s ease;background:var(--muted);}
  .fill.q{background:var(--text);}
  .pacewrap{display:flex;align-items:center;justify-content:space-between;margin-top:3px;}
  .pacelbl{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;}
  .q{font-family:var(--mono);font-weight:500;letter-spacing:-.01em;text-align:center;line-height:1.1;
    font-size:clamp(2.6rem,15vw,4.4rem);}
  .q .op{all:unset;color:var(--accent);font-family:var(--mono);margin:0 .12em;}
  .ans{width:min(78%,300px);background:var(--surface);border:2px solid var(--line2);border-radius:16px;
    color:var(--text);font-family:var(--mono);font-size:clamp(2rem,9vw,2.8rem);font-weight:600;
    text-align:center;padding:14px 10px;outline:none;transition:border-color .12s,background .12s;}
  .ans:focus{border-color:var(--accent);}
  .ans.good{border-color:var(--ok);background:rgba(52,211,153,.08);}
  .shake{animation:shk .26s;}
  @keyframes shk{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}

  .result{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .verdict{text-align:center;margin-bottom:24px;}
  .verdict .big{font-family:var(--mono);font-size:54px;font-weight:700;line-height:1;}
  .verdict .cap{color:var(--muted);font-size:14px;margin-top:8px;}
  .pacetag{display:inline-block;margin-top:14px;padding:7px 16px;border-radius:30px;font-size:13.5px;font-weight:600;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;}
  .stat .k{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;}
  .stat .v{font-family:var(--mono);font-size:24px;font-weight:600;margin-top:5px;}
  .best{text-align:center;font-size:13px;color:var(--muted);margin:6px 0 22px;}
  .best b{color:var(--accent);}
  .twobtn{display:flex;gap:10px;margin-top:auto;}
  .twobtn button{flex:1;border-radius:var(--r);padding:16px;font-size:16px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:transform .1s;}
  .twobtn button:active{transform:scale(.98);}
  .again{border:none;background:var(--accent);color:#1a1205;}
  .edit{border:1px solid var(--line2);background:var(--surface);color:var(--text);}
</style>
</head>
<body data-theme="dark">
<div class="app">

  <!-- SETUP -->
  <section class="screen on" id="setup">
    <div class="topbar">
      <div class="brand"><b>QuickMath</b><span>Drill</span></div>
      <button class="icobtn" id="theme" aria-label="Toggle theme">☾</button>
    </div>

    <div class="block">
      <p class="label">Operations</p>
      <div class="ops" id="ops">
        <button class="op sel" data-op="add">+</button>
        <button class="op" data-op="sub">−</button>
        <button class="op" data-op="mul">×</button>
        <button class="op" data-op="div">÷</button>
      </div>
    </div>

    <div class="block">
      <p class="label">Number size</p>
      <div class="seg" id="segFrom"><span class="t">From</span>
        <div class="pill sel" data-d="1">1‑digit</div>
        <div class="pill" data-d="2">2‑digit</div>
        <div class="pill" data-d="3">3‑digit</div>
      </div>
      <div class="seg" id="segTo"><span class="t">To</span>
        <div class="pill" data-d="1">1‑digit</div>
        <div class="pill sel" data-d="2">2‑digit</div>
        <div class="pill" data-d="3">3‑digit</div>
      </div>
    </div>

    <div class="block">
      <p class="label">Round</p>
      <div class="field">
        <div><label>Questions</label><span class="sub">how many to solve</span></div>
        <input id="numQ" type="number" inputmode="numeric" value="20" min="1" max="300" />
      </div>
      <div class="field">
        <div><label>Target time</label><span class="sub">minutes to beat</span></div>
        <input id="numT" type="number" inputmode="decimal" value="3" min="0.5" max="120" step="0.5" />
      </div>
    </div>

    <button class="start" id="startBtn">Start drill</button>
    <p class="hint" id="hint"></p>
  </section>

  <!-- GAME -->
  <section class="screen" id="game">
    <div class="gtop">
      <span class="qcount"><b id="qNow">1</b> / <span id="qTot">20</span></span>
      <span class="clock" id="clock">0:00</span>
      <button class="quit" id="quit">Quit</button>
    </div>
    <div class="bars">
      <div class="track"><div class="fill q" id="qFill"></div></div>
      <div class="track"><div class="fill" id="tFill"></div></div>
      <div class="pacewrap">
        <span class="pacelbl" id="paceLbl">On pace</span>
        <span class="pacelbl" id="targetLbl"></span>
      </div>
    </div>
    <div class="stage">
      <div class="q" id="q">— + —</div>
      <input class="ans" id="ans" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" />
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="result">
    <div class="topbar">
      <div class="brand"><b>Round complete</b></div>
    </div>
    <div class="result">
      <div class="verdict">
        <div class="big" id="rTime">0:00</div>
        <div class="cap" id="rCap">20 questions</div>
        <div class="pacetag" id="rTag"></div>
      </div>
      <div class="grid2">
        <div class="stat"><div class="k">Avg / question</div><div class="v" id="rAvg">—</div></div>
        <div class="stat"><div class="k">vs target</div><div class="v" id="rDelta">—</div></div>
      </div>
      <p class="best" id="rBest"></p>
      <div class="twobtn">
        <button class="edit" id="editBtn">Change setup</button>
        <button class="again" id="againBtn">Run again</button>
      </div>
    </div>
  </section>

</div>

<script>
(function(){
  "use strict";
  var S={ops:["add"],from:1,to:2,n:20,t:180};
  var ops={add:"+",sub:"−",mul:"×",div:"÷"};
  var $=function(id){return document.getElementById(id);};
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

  /* theme */
  var saved=store("qm_theme")||"dark";
  document.body.setAttribute("data-theme",saved);
  $("theme").textContent=saved==="dark"?"☾":"☀";
  $("theme").onclick=function(){
    var t=document.body.getAttribute("data-theme")==="dark"?"light":"dark";
    document.body.setAttribute("data-theme",t);store("qm_theme",t);
    this.textContent=t==="dark"?"☾":"☀";
  };

  /* operations multi-select */
  document.querySelectorAll("#ops .op").forEach(function(b){
    b.onclick=function(){
      var sel=document.querySelectorAll("#ops .op.sel");
      if(b.classList.contains("sel")&&sel.length===1)return; /* keep >=1 */
      b.classList.toggle("sel");validate();
    };
  });
  /* digit segments */
  function bindSeg(wrap){
    wrap.querySelectorAll(".pill").forEach(function(p){
      p.onclick=function(){
        wrap.querySelectorAll(".pill").forEach(function(x){x.classList.remove("sel");});
        p.classList.add("sel");syncDigits();validate();
      };
    });
  }
  bindSeg($("segFrom"));bindSeg($("segTo"));
  function syncDigits(){
    var f=+$("segFrom").querySelector(".sel").dataset.d;
    var t=+$("segTo").querySelector(".sel").dataset.d;
    if(t<f){ /* force To >= From */
      $("segTo").querySelectorAll(".pill").forEach(function(x){x.classList.toggle("sel",+x.dataset.d===f);});
    }
  }
  $("numQ").oninput=validate;$("numT").oninput=validate;
  function validate(){
    var n=parseInt($("numQ").value,10), t=parseFloat($("numT").value);
    var msg="";
    if(!(n>=1)) msg="Enter at least 1 question";
    else if(!(t>=0.5)) msg="Target time must be at least 0.5 min";
    $("hint").textContent=msg;
    $("startBtn").disabled=!!msg;
  }

  /* number generation */
  function randDigits(d){
    if(d===1)return rnd(2,9);
    var lo=Math.pow(10,d-1), hi=Math.pow(10,d)-1;return rnd(lo,hi);
  }
  function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  function pickD(){return rnd(S.from,S.to);}
  function makeQ(){
    var op=S.ops[rnd(0,S.ops.length-1)],a,b,ans,disp;
    if(op==="add"){a=randDigits(pickD());b=randDigits(pickD());ans=a+b;disp=a+sep("+")+b;}
    else if(op==="sub"){a=randDigits(pickD());b=randDigits(pickD());if(b>a){var z=a;a=b;b=z;}ans=a-b;disp=a+sep("−")+b;}
    else if(op==="mul"){a=randDigits(pickD());b=randDigits(pickD());ans=a*b;disp=a+sep("×")+b;}
    else{ /* div: build from product so answer is clean */
      var dv=randDigits(pickD()),q=randDigits(pickD());var prod=dv*q;ans=q;disp=prod+sep("÷")+dv;}
    return {disp:disp,ans:ans};
  }
  function sep(s){return ' <i class="op">'+s+'</i> ';}

  /* round state */
  var idx,correct,startT,raf,cur,timerId;
  function startRound(){
    S.ops=[];document.querySelectorAll("#ops .op.sel").forEach(function(b){S.ops.push(b.dataset.op);});
    S.from=+$("segFrom").querySelector(".sel").dataset.d;
    S.to=+$("segTo").querySelector(".sel").dataset.d;
    S.n=parseInt($("numQ").value,10);
    S.t=Math.round(parseFloat($("numT").value)*60);
    store("qm_cfg",JSON.stringify({ops:S.ops,from:S.from,to:S.to,n:S.n,t:S.t}));
    idx=0;correct=0;
    $("qTot").textContent=S.n;
    $("targetLbl").textContent="target "+fmt(S.t)+" · "+(S.t/S.n).toFixed(1)+"s/q";
    show("game");
    startT=performance.now();
    next();
    tick();
    timerId=setInterval(tick,200);
  }
  function next(){
    cur=makeQ();
    $("q").innerHTML=cur.disp;
    var inp=$("ans");inp.value="";inp.classList.remove("good");
    $("qNow").textContent=Math.min(idx+1,S.n);
    inp.focus();
  }
  function tick(){
    var el=(performance.now()-startT)/1000;
    $("clock").textContent=fmt(el);
    var qp=idx/S.n, tp=Math.min(el/S.t,1);
    $("qFill").style.width=(qp*100)+"%";
    $("tFill").style.width=(tp*100)+"%";
    /* pace: expected fraction of time vs fraction of questions done */
    var lbl=$("paceLbl"),fill=$("tFill");
    if(idx===0){lbl.textContent="Go";lbl.style.color="var(--muted)";fill.style.background="var(--muted)";return;}
    var ratio=(el/S.t)/(idx/S.n);
    if(ratio<=0.92){lbl.textContent="Ahead of target";lbl.style.color="var(--ok)";fill.style.background="var(--ok)";}
    else if(ratio<=1.08){lbl.textContent="On pace";lbl.style.color="var(--accent)";fill.style.background="var(--accent)";}
    else{lbl.textContent="Behind target";lbl.style.color="var(--bad)";fill.style.background="var(--bad)";}
  }
  function fmt(s){s=Math.floor(s);return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);}

  $("ans").addEventListener("input",function(){
    var v=this.value.trim();
    if(v===""||v==="-")return;
    if(parseInt(v,10)===cur.ans){
      this.classList.add("good");idx++;correct++;
      if(idx>=S.n){finish();return;}
      setTimeout(next,90);
    }
  });
  $("ans").addEventListener("keydown",function(e){
    if(e.key==="Enter"){
      var v=this.value.trim();
      if(v!==""&&parseInt(v,10)!==cur.ans){
        this.classList.add("shake");
        var self=this;setTimeout(function(){self.classList.remove("shake");},260);
      }
    }
  });

  function finish(){
    clearInterval(timerId);
    var el=(performance.now()-startT)/1000;
    show("result");
    $("rTime").textContent=fmt(el);
    $("rCap").textContent=S.n+" questions · "+opLabel();
    var avg=el/S.n;
    $("rAvg").textContent=avg.toFixed(1)+"s";
    var delta=el-S.t;
    $("rDelta").textContent=(delta<=0?"−":"+")+fmt(Math.abs(delta));
    $("rDelta").style.color=delta<=0?"var(--ok)":"var(--bad)";
    var tag=$("rTag");
    if(delta<=0){tag.textContent="Target beaten by "+fmt(Math.abs(delta));tag.style.background="rgba(52,211,153,.15)";tag.style.color="var(--ok)";}
    else{tag.textContent="Over target by "+fmt(delta);tag.style.background="rgba(251,111,111,.15)";tag.style.color="var(--bad)";}
    /* best avg per config signature */
    var sig="qm_best_"+S.ops.slice().sort().join("")+"_"+S.from+S.to;
    var prev=parseFloat(store(sig));
    if(!prev||avg<prev){store(sig,avg.toFixed(2));$("rBest").innerHTML="<b>New best</b> for this setup · "+avg.toFixed(1)+"s/q";}
    else{$("rBest").innerHTML="Best for this setup: <b>"+prev.toFixed(1)+"s/q</b>";}
  }
  function opLabel(){return S.ops.map(function(o){return ops[o];}).join(" ");}

  function show(id){
    document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("on");});
    $(id).classList.add("on");
  }

  $("startBtn").onclick=startRound;
  $("againBtn").onclick=startRound;
  $("editBtn").onclick=function(){show("setup");};
  $("quit").onclick=function(){clearInterval(timerId);show("setup");};

  /* restore last config */
  try{var c=JSON.parse(store("qm_cfg"));if(c){
    document.querySelectorAll("#ops .op").forEach(function(b){b.classList.toggle("sel",c.ops.indexOf(b.dataset.op)>=0);});
    $("segFrom").querySelectorAll(".pill").forEach(function(p){p.classList.toggle("sel",+p.dataset.d===c.from);});
    $("segTo").querySelectorAll(".pill").forEach(function(p){p.classList.toggle("sel",+p.dataset.d===c.to);});
    $("numQ").value=c.n;$("numT").value=(c.t/60);
  }}catch(e){}
  validate();

  /* service worker (only over http/https) */
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();
</script>
</body>
</html>
